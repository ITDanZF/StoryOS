<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">书架卡片操作与字号设计</title>
  <desc id="desc">卡片底部保留十四像素的三维阅读按钮。更多菜单包含导出书籍、查看项目归档和分组后的移入回收站。</desc>
  <defs>
    <linearGradient id="cover" x2="1" y2="1"><stop stop-color="#607b79"/><stop offset="1" stop-color="#203738"/></linearGradient>
    <clipPath id="round"><rect x="32" y="88" width="360" height="280" rx="16"/></clipPath>
  </defs>
  <rect width="940" height="430" fill="#f5f5f2"/>
  <g font-family="Microsoft YaHei UI, PingFang SC, sans-serif" fill="#262626">
    <text x="32" y="36" font-size="22" font-weight="600">书架操作与文字层级</text>
    <text x="32" y="61" font-size="14" fill="#666">推荐方案 · 阅读常驻，管理收纳，功能文字清晰可读</text>
    <rect x="32" y="88" width="360" height="280" rx="16" fill="white" stroke="#deded9"/>
    <g clip-path="url(#round)">
      <rect x="32" y="88" width="112" height="280" fill="url(#cover)"/>
      <path d="M32 225L144 188" stroke="#c1d8cf" stroke-opacity=".22" stroke-width="4"/>
      <text x="48" y="115" font-size="11" fill="#e5efed" letter-spacing="1">PLANNING</text>
      <g font-family="SimSun, Songti SC, serif" font-size="26" fill="#fff">
        <text x="48" y="269">野外山</text><text x="48" y="304">村的小</text><text x="48" y="339">屋</text>
      </g>
    </g>
    <text x="160" y="118" font-size="13" fill="#666">构思中</text>
    <text x="211" y="118" font-size="13" fill="#2f6b50">· 已关联</text>
    <rect x="340" y="96" width="36" height="36" rx="8" fill="#f4f4f2"/>
    <g fill="#525252"><circle cx="352" cy="114" r="1.5"/><circle cx="358" cy="114" r="1.5"/><circle cx="364" cy="114" r="1.5"/></g>
    <text x="160" y="157" font-size="20" font-family="SimSun, Songti SC, serif" font-weight="600">野外山村的小屋</text>
    <text x="160" y="192" font-size="14" fill="#525252">晚风穿过树林，远处的灯火</text>
    <text x="160" y="214" font-size="14" fill="#525252">照亮了回家的路。</text>
    <text x="160" y="268" font-size="13" fill="#666">更新于 8/31</text>
    <path d="M160 286H376" stroke="#e8e8e4"/>
    <text x="160" y="323" font-size="13" fill="#666">3 章 · 9,611 字</text>
    <g transform="translate(280 299)" fill="none" stroke="#525252" stroke-width="1.75" stroke-linejoin="round"><path d="M2 7Q6 5 10 8Q14 5 18 7V20Q14 18 10 21Q6 18 2 20Z"/><path d="M10 8V21"/></g>
    <text x="306" y="320" font-size="14" fill="#525252">3D 阅读</text>
    <path d="M398 115H446" stroke="#a4aaa0" stroke-dasharray="4 4"/>
    <text x="464" y="110" font-size="14" font-weight="600">更多菜单 · 224px</text>
    <rect x="464" y="130" width="224" height="188" rx="12" fill="white" stroke="#deded9"/>
    <g stroke="#525252" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M487 150V161M483 157L487 161L491 157M480 163V167H494V163"/>
      <path d="M480 190H494V194H480ZM482 194V207H492V194M485 198H489"/>
    </g>
    <text x="514" y="163" font-size="14">导出书籍</text>
    <text x="514" y="203" font-size="14">查看项目归档</text>
    <path d="M480 226H672" stroke="#e8e8e4"/>
    <g stroke="#737373" stroke-width="1.75" fill="none" stroke-linecap="round"><path d="M480 249H494M484 249V246H490V249M482 249L483 263H491L492 249M486 253V259M489 253V259"/></g>
    <text x="514" y="260" font-size="14" fill="#737373">移入回收站</text>
    <text x="480" y="293" font-size="13" fill="#666">仍关联项目，暂不能回收</text>
    <text x="722" y="159" font-size="14" font-weight="600">14px 操作文字</text>
    <text x="722" y="183" font-size="13" fill="#666">40px 菜单行高</text>
    <text x="722" y="207" font-size="13" fill="#666">18px 图标</text>
    <text x="722" y="260" font-size="13" fill="#666">回收操作单独分组</text>
    <text x="722" y="284" font-size="13" fill="#666">禁用时说明原因</text>
    <text x="464" y="351" font-size="13" fill="#666">可回收时，该操作使用红色文字与图标。</text>
    <text x="464" y="375" font-size="13" fill="#666">菜单不再重复放置「3D 阅读」。</text>
    <text x="32" y="406" font-size="12" fill="#666">布局示意，尚未实施；请在应用实际尺寸与系统缩放下验收。</text>
  </g>
</svg>
