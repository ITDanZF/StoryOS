<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#60796b" stroke-width="1.5"/></marker><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203c34}.title{font-size:36px;font-weight:700}.h{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#66786f}.sub{font-size:19px;fill:#66786f}.tag{font-size:18px;font-weight:700}.code{font-size:16px;font-family:Consolas,'Microsoft YaHei',monospace;fill:#557067}.line{fill:none;stroke:#60796b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1800" height="1280" fill="#f5f6f1"/><text x="64" y="77" class="title">第一部分 · 现有业务核心关系</text><text x="64" y="114" class="sub">围绕已经存在的产品功能重设计；图为业务主干，字段与约束见配套文档</text><rect x="64" y="158" width="1672" height="306" rx="16" fill="#eeeade" stroke="#d1dcd2"/><text x="88" y="198" class="h">应用库：登记、绑定、阅读与恢复</text><rect x="87" y="226" width="360" height="193" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="111" y="266" class="h">项目</text><text x="111" y="297" class="code">projects</text><text x="111" y="341" class="body">本机路径 / 信任 / 最近打开</text><rect x="512" y="226" width="360" height="193" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="536" y="266" class="h">书籍登记</text><text x="536" y="297" class="code">book_registry</text><text x="536" y="341" class="body">位置 / 状态 / 回收时间</text><rect x="937" y="226" width="360" height="193" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="961" y="266" class="h">书架与阅读</text><text x="961" y="297" class="code">catalog / reading_states</text><text x="961" y="341" class="body">摘要投影 / 设备阅读锚点</text><rect x="1362" y="226" width="350" height="193" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="1386" y="266" class="h">归档与存储操作</text><text x="1386" y="297" class="code">archives / operations</text><text x="1386" y="341" class="body">恢复策略 / 清理明细</text><path d="M450 316H496" class="line"/><text x="461" y="301" class="small">绑定</text><path d="M875 316H921" class="line"/><text x="887" y="301" class="small">关联</text><text x="88" y="446" class="small">绑定保留当前规则：一项目一主书、一书最多一个可写项目；永久清理明细在书籍登记删除后仍保留。</text><path d="M692 466V496" class="line dash"/><text x="710" y="490" class="small">书籍 ID 逻辑关联</text><rect x="64" y="514" width="1672" height="351" rx="16" fill="#e6eee1" stroke="#d1dcd2"/><text x="88" y="553" class="h">独立书库：书籍 → 分卷（可选）→ 章节</text><rect x="87" y="583" width="360" height="190" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="111" y="623" class="h">章节</text><text x="111" y="654" class="code">chapters</text><text x="111" y="698" class="body">顺序 / 状态 / 当前版本指针</text><rect x="512" y="583" width="360" height="190" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="536" y="623" class="h">不可变修订</text><text x="536" y="654" class="code">chapter_revisions</text><text x="536" y="698" class="body">本章历史 / 父版本 / 内容哈希</text><rect x="937" y="583" width="360" height="190" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="961" y="623" class="h">正文载荷</text><text x="961" y="654" class="code">revision_documents</text><text x="961" y="698" class="body">文档 JSON / 版本化纯文本</text><rect x="1362" y="583" width="350" height="190" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="1386" y="623" class="h">编辑草稿</text><text x="1386" y="654" class="code">chapter_drafts</text><text x="1386" y="698" class="body">设备 / 保存基线 / 草稿版本</text><path d="M450 664H496" class="line"/><text x="464" y="650" class="small">1:N</text><path d="M875 664H921" class="line"/><text x="889" y="650" class="small">1:1</text><path d="M268 776V806H1537V776" class="line"/><text x="646" y="797" class="small">每章、每设备一个工作草稿；提交时验证基线</text><text x="88" y="844" class="small">同一事务：校验基线 → 新修订与正文 → 更新当前指针 → 追加 book_changes；派生索引随后更新。</text><rect x="64" y="910" width="1672" height="271" rx="16" fill="#e4ecef" stroke="#d1dcd2"/><text x="88" y="949" class="h">工作区：现有 Agent 与会话</text><rect x="87" y="977" width="360" height="167" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="111" y="1017" class="h">会话与技能绑定</text><text x="111" y="1048" class="code">threads / thread_skills</text><text x="111" y="1092" class="body">当前会话与关联书籍</text><rect x="512" y="977" width="360" height="167" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="536" y="1017" class="h">运行记录</text><text x="536" y="1048" class="code">agent_runs</text><text x="536" y="1092" class="body">状态 / 基线 / 错误与重试</text><rect x="937" y="977" width="360" height="167" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="961" y="1017" class="h">权威事件</text><text x="961" y="1048" class="code">conversation_events</text><text x="961" y="1092" class="body">用户输入 / 流式 / 工具 / 确认</text><rect x="1362" y="977" width="350" height="167" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="1386" y="1017" class="h">消息列表</text><text x="1386" y="1048" class="code">message_views</text><text x="1386" y="1092" class="body">从事件重建，按顺序分页</text><path d="M450 1057H496" class="line"/><path d="M875 1057H921" class="line"/><path d="M1300 1057H1346" class="line"/><text x="88" y="1168" class="small">检查点和技能内容沿用独立管理方式；原项目全文检索在第二部分统一接入，但现有定位能力必须保留。</text><text x="64" y="1230" class="body">本图不提前加入人物、大纲、知识图谱或实时协作表，先保证当前业务映射完整。</text></svg>