<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#60796b" stroke-width="1.5"/></marker><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203c34}.title{font-size:36px;font-weight:700}.h{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#66786f}.sub{font-size:19px;fill:#66786f}.tag{font-size:18px;font-weight:700}.code{font-size:16px;font-family:Consolas,'Microsoft YaHei',monospace;fill:#557067}.line{fill:none;stroke:#60796b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1600" height="1280" fill="#f5f6f1"/><text x="64" y="77" class="title">StoryOS · 数据架构重设计</text><text x="64" y="115" class="sub">v0.2 · 先完整重设计现有业务，再设计向量数据库与 Agent RAG</text><rect x="64" y="159" width="1472" height="60" rx="16" fill="#dfe9dd" stroke="#d1dcd2"/><text x="87" y="197" class="h">01  现有业务重设计</text><text x="960" y="196" class="small">以当前功能与旧表映射为第一评审对象</text><rect x="64" y="246" width="462" height="294" rx="16" fill="#f0eee4" stroke="#d1dcd2"/><text x="88" y="286" class="h">应用与本机状态</text><text x="88" y="317" class="code">app.sqlite</text><text x="88" y="361" class="body">项目 / 书籍登记 / 当前绑定</text><text x="88" y="395" class="body">书架摘要 / 阅读进度</text><text x="88" y="429" class="body">归档 / 恢复阶段 / 清理记录</text><text x="88" y="463" class="body">目标：列表高效，操作可恢复</text><rect x="569" y="246" width="462" height="294" rx="16" fill="#e3eddf" stroke="#d1dcd2"/><text x="593" y="286" class="h">独立书籍资产</text><text x="593" y="317" class="code">book.sqlite · 每本书</text><text x="593" y="361" class="body">书籍资料 / 卷 / 章</text><text x="593" y="395" class="body">设备草稿 / 不可变修订 / 正文</text><text x="593" y="429" class="body">当前版本指针 / 业务变更日志</text><text x="593" y="463" class="body">目标：保存可靠，版本可追溯</text><rect x="1074" y="246" width="462" height="294" rx="16" fill="#e5edf0" stroke="#d1dcd2"/><text x="1098" y="286" class="h">会话与 Agent 运行</text><text x="1098" y="317" class="code">project.sqlite · 每工作区</text><text x="1098" y="361" class="body">会话 / 技能绑定 / 运行状态</text><text x="1098" y="395" class="body">流式事件 / 消息列表投影</text><text x="1098" y="429" class="body">错误与确认记录 / 独立检查点</text><text x="1098" y="463" class="body">目标：当前 Agent 流程完整保留</text><text x="64" y="579" class="body">创建、编辑、阅读、导入导出、归档恢复和回收站：均先在业务层独立运行。</text><path d="M800 542V613" class="line"/><rect x="64" y="630" width="1472" height="86" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="88" y="666" class="h">提供给 RAG 的稳定接口</text><text x="88" y="697" class="body">书籍与章节 ID  +  当前修订  +  文件来源  +  范围约束  +  可恢复变更通知</text><path d="M800 718V749" class="line"/><rect x="64" y="766" width="1472" height="60" rx="16" fill="#dfe7ed" stroke="#d1dcd2"/><text x="87" y="804" class="h">02  向量数据库与 Agent RAG</text><text x="1020" y="803" class="small">本次明确设计范围，不是可选预留</text><rect x="64" y="851" width="462" height="243" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="88" y="891" class="h">专业资料资产</text><text x="88" y="922" class="code">knowledge.sqlite + 原始资料</text><text x="88" y="966" class="body">资料集 / 文档 / 不可变文件版本</text><text x="88" y="1000" class="body">方法论、专业知识、参考资料</text><text x="88" y="1034" class="body">书籍与项目显式绑定，可共享</text><rect x="569" y="851" width="462" height="243" rx="16" fill="#e3eddf" stroke="#d1dcd2"/><text x="593" y="891" class="h">本地混合检索</text><text x="593" y="922" class="code">SQLite + LanceDB（建议）</text><text x="593" y="966" class="body">小说：按书隔离的向量库</text><text x="593" y="1000" class="body">专业资料：共享文档向量库</text><text x="593" y="1034" class="body">全文 + 向量，版本化发布</text><rect x="1074" y="851" width="462" height="243" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="1098" y="891" class="h">Agent 上下文</text><text x="1098" y="922" class="code">RAG requests / manifests / sources</text><text x="1098" y="966" class="body">范围校验 / 配额 / 融合与重排</text><text x="1098" y="1000" class="body">区分小说证据和外部方法</text><text x="1098" y="1034" class="body">记录实际片段、出处与预算</text><path d="M529 997H554" class="line"/><path d="M1034 997H1059" class="line"/><rect x="64" y="1130" width="1472" height="91" rx="16" fill="#f0eee4" stroke="#d1dcd2"/><text x="88" y="1169" class="h">后续扩展单独评审</text><text x="88" y="1201" class="body">人物、大纲、事实与伏笔；云同步与多人协作。它们不阻塞当前业务重设计和本次 RAG 设计。</text><text x="64" y="1255" class="small">设计材料 · 尚未实施 SQL 或数据库变更 · 向量后端需在目标 Electron / Windows 环境验证</text></svg>