<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#60796b" stroke-width="1.5"/></marker><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#203c34}.title{font-size:36px;font-weight:700}.h{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#66786f}.sub{font-size:19px;fill:#66786f}.tag{font-size:18px;font-weight:700}.code{font-size:16px;font-family:Consolas,'Microsoft YaHei',monospace;fill:#557067}.line{fill:none;stroke:#60796b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1800" height="1510" fill="#f5f6f1"/><text x="64" y="77" class="title">第二部分 · 小说与专业资料的 Agent RAG</text><text x="64" y="115" class="sub">向量数据库已纳入本次完整设计；两类知识分开管理，在明确范围内联合使用</text><rect x="64" y="170" width="798" height="229" rx="16" fill="#e3eddf" stroke="#d1dcd2"/><text x="88" y="210" class="h">小说自身：已经写了什么</text><text x="88" y="241" class="code">book.sqlite / 当前章节修订</text><text x="88" y="285" class="body">当前书籍 → 允许章节 → 固定修订</text><text x="88" y="319" class="body">章节保存、删除、恢复驱动增量更新</text><text x="88" y="353" class="body">每书独立向量目录；未保存草稿按请求直接使用</text><rect x="938" y="170" width="798" height="229" rx="16" fill="#eeeade" stroke="#d1dcd2"/><text x="962" y="210" class="h">专业资料：方法与外部知识</text><text x="962" y="241" class="code">knowledge.sqlite / 托管原始文件</text><text x="962" y="285" class="body">资料集 → 文档 → 不可变文件版本</text><text x="962" y="319" class="body">PDF / DOCX / Markdown / 文本；解析与 OCR 单独记录</text><text x="962" y="353" class="body">多书引用同一资料；集合变化不重复生成文档向量</text><path d="M463 402V443" class="line"/><path d="M1337 402V443" class="line"/><rect x="64" y="460" width="1672" height="102" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="88" y="500" class="h">来源适配与版本化处理</text><text x="88" y="536" class="body">原文版本 → 解析与定位 → 结构化分块 → Embedding；模型空间包含模型版本、维度、距离和输入模板</text><path d="M463 565V606" class="line"/><path d="M1337 565V606" class="line"/><rect x="64" y="623" width="798" height="220" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="88" y="663" class="h">SQLite：检索元数据与全文索引</text><text x="88" y="694" class="code">source_versions / chunk_sets / publications</text><text x="88" y="738" class="body">保存片段、页码或章内位置、FTS 与发布清单</text><text x="88" y="772" class="body">同一文档版本与管线确定一个完整分块集合</text><text x="88" y="806" class="body">小说、资料库、项目文件各自有作用域</text><rect x="938" y="623" width="798" height="220" rx="16" fill="#e3eddf" stroke="#d1dcd2"/><text x="962" y="663" class="h">LanceDB：实际向量与向量索引</text><text x="962" y="694" class="code">vectors · scope + source version + chunk + space</text><text x="962" y="738" class="body">小说与专业资料物理分开；向量维度固定</text><text x="962" y="772" class="body">精确向量检索 → 按规模评测 ANN 与标量索引</text><text x="962" y="806" class="body">确定性 ID 幂等写入；不同模型空间独立构建</text><path d="M463 846V883" class="line"/><path d="M1337 846V883" class="line"/><rect x="64" y="900" width="1672" height="111" rx="16" fill="#e5ece3" stroke="#d1dcd2"/><text x="88" y="940" class="h">一致性关键：准备 → 向量提交 → 完整性校验 → SQLite 原子发布</text><text x="88" y="976" class="body">查询只采用已发布且仍有效的分块集合；旧任务不能覆盖新版，未发布数据不可见，删除先禁止使用再清理。</text><path d="M900 1014V1053" class="line"/><rect x="64" y="1070" width="1672" height="198" rx="16" fill="#e4ecef" stroke="#d1dcd2"/><text x="88" y="1110" class="h">Agent RAG 查询流程</text><text x="88" y="1150" class="body">① 解析当前书籍与已启用资料集    ② 各语料分别执行全文 + 向量召回    ③ 名次融合 / 去重 / 可选重排</text><text x="88" y="1190" class="body">④ 复核版本、删除状态与章节范围    ⑤ 按来源配额和完整请求预算组装    ⑥ 记录实际采用的片段与出处</text><text x="88" y="1240" class="small">上下文明确区分：小说证据 / 专业方法与参考 / 当前草稿与任务要求。资料内容不是 Agent 执行指令。</text><path d="M900 1271V1310" class="line"/><rect x="64" y="1327" width="1672" height="98" rx="16" fill="#fff" stroke="#d1dcd2"/><text x="88" y="1365" class="h">生成与追溯</text><text x="88" y="1401" class="body">rag_requests + context_manifests + context_sources；生成结果仍通过现有业务保存入口与基线校验提交。</text><text x="64" y="1472" class="small">本地优先 · 原始资料需要备份，派生向量可以重建 · SDK 打包、检索质量、资源与异常恢复待实施验证</text></svg>