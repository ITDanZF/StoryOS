<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryOS · 事件图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./storywriter.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span><strong>StoryOS</strong><small>事件图</small></span>
      </div>
      <p class="piece" id="piece">G = (V, E)</p>
      <div class="tools" id="tools"></div>
    </header>
    <div class="stage">
      <div class="viewport" id="viewport" tabindex="0" aria-label="事件图">
        <div class="world" id="world">
          <svg id="edges" aria-hidden="true"></svg>
          <div id="vertices"></div>
        </div>
        <div class="legend" id="legend"></div>
        <p class="hint">主边清晰，其余更淡 · 点顶点聚焦相关点和边</p>
      </div>
      <aside class="inspector" id="inspector" aria-label="邻接表"></aside>
    </div>
  </div>
  <script src="./storywriter.js"></script>
</body>
</html>
