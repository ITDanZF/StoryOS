name: 缺陷报告
description: 应用崩溃、错误结果或与文档不符的行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要在此提交 API Key、未公开稿件或安全漏洞。安全问题见 [SECURITY.md](https://github.com/ITDanZF/StoryOS/blob/main/SECURITY.md)。
  - type: textarea
    id: what-happened
    attributes:
      label: 实际结果
      description: 发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 main @ 1b2e76a，或安装包文件名
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 版本、是否从源码运行、相关模型服务（不要填写 Key）
  - type: textarea
    id: extra
    attributes:
      label: 日志或截图
      description: 请去掉密钥、本机私人路径和稿件正文后再粘贴。
