name: 功能建议
description: 新能力或现有流程的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前缺少什么，或现有流程卡在哪里
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的使用方式。若只是想法，写清场景即可。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代做法
      description: 你现在如何绕过，或是否考虑过其他实现。
